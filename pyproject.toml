[project]
name = "sentinel"
version = "1.0.0"
description = "Long-term portfolio management system"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "tradernet-sdk>=2.0.0",
    "numpy>=2.4.0",
    "pandas>=2.2.0",
    "scipy>=1.17.1",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.26.0",
    "APScheduler>=3.10.0",
    "httpx>=0.28.0",
    "asyncpg>=0.31.0",
    "mcp>=2.1.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "pyright>=1.1.0",
    # Used by the validate-yaml pre-commit hook in lefthook.yml.
    "pyyaml>=6.0",
]
[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
exclude = ["web*", "data*"]

[tool.setuptools.package-data]
sentinel = [
    "task_definitions/**/*.js",
    "task_definitions/**/*.json",
    "task_definitions/**/*.md",
    "task_definitions/**/*.mjs",
    "task_definitions/**/*.py",
    "tasks/*.mjs",
    "tasks/vendor/*.cjs",
    "tasks/vendor/*.md",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"sentinel/backtester.py" = ["S101"]  # Type narrowing assertions
"sentinel/task_definitions/**/*.py" = ["E501", "F541", "I001", "S"]  # Ported user-editable Clara task files

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["sentinel", "main.py"]
# Downgrade annotation-dependent rules to warning until project adds type annotations
reportOptionalMemberAccess = "warning"
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportOperatorIssue = "warning"
reportAssignmentType = "warning"
reportReturnType = "warning"
reportOptionalSubscript = "warning"
reportMissingImports = "warning"

[tool.pytest.ini_options]
pythonpath = ["."]
